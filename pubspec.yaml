name: ebook_reader
description: 墨水屏阅读器（E-ink Reader）— Flutter 壳 + WebView 阅读引擎 + Android EPD 刷新插件
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # WebView 阅读引擎容器（v6 起带 web 平台实现，便于 chrome 联调）
  flutter_inappwebview: ^6.1.5

  # 数据层
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # 导书（SAF，免存储权限）
  file_picker: ^8.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/web/
    - assets/books/
    - assets/fonts/

  # 内置字体：将思源宋体/黑体 .otf/.ttf 放入 assets/fonts/ 即可，
  # FontManager 会在首次启动时拷贝到沙盒并暴露给 WebView 的 @font-face。
  # （二进制字体不入库，目录里附字体说明。）
