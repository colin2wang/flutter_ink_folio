<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>inkreader engine</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      /* e-ink: transitions / animations / blurs / shadows are globally disabled */
      transition: none !important;
      animation: none !important;
      -webkit-font-smoothing: antialiased;
    }
    #page-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
  </style>
  <script type="module" crossorigin src="./main.js"></script>
</head>
<body>
  <div id="page-container"></div>
